<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-labelledby="title description">
  <title id="title">BOTW Compiled</title>
  <desc id="description">Présentation inspirée des menus de Breath of the Wild : panneau noir, texte ivoire et filets fins. Port natif Windows, en développement.</desc>
  <rect width="1280" height="430" fill="#080b0d"/>
  <rect x="20.5" y="20.5" width="1239" height="389" fill="none" stroke="#66645a"/>
  <path d="M52 101h1176M52 342h1176M914 131v179" stroke="#343631"/>
  <g font-family="'Segoe UI', Arial, sans-serif" fill="#e2ded3">
    <text x="61" y="72" font-size="17" font-style="italic" letter-spacing="2.2">BREATH OF THE WILD</text>
    <text x="1219" y="72" text-anchor="end" font-size="13" letter-spacing="2.3" fill="#aaa79d">PROJET NATIF · WINDOWS</text>
    <text x="57" y="202" font-size="89" font-style="italic" font-weight="600" letter-spacing="3">BOTW COMPILED</text>
    <text x="64" y="258" font-size="23" font-style="italic" fill="#e2ded3">Redécouvrir Hyrule, autrement.</text>
    <text x="64" y="299" font-size="15" fill="#aaa79d">Recompilation Wii U · Liberté graphique · Personnalisation</text>
    <text x="957" y="158" font-size="12" letter-spacing="2.3" fill="#aaa79d">NOTRE AVENTURE</text>
    <text x="957" y="203" font-size="20" font-style="italic">Un port sur PC.</text>
    <text x="957" y="240" font-size="20" font-style="italic">Une image à façonner.</text>
    <text x="957" y="277" font-size="20" font-style="italic">Votre signature.</text>
    <circle cx="66" cy="374" r="3" fill="#e2ded3"/>
    <text x="82" y="379" font-size="12" letter-spacing="2" fill="#bbb6a7">EN DÉVELOPPEMENT</text>
    <text x="1219" y="379" text-anchor="end" font-size="12" fill="#aaa79d">L'aventure se construit.</text>
  </g>
</svg>
